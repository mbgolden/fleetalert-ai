name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run bandit -r src
      - run: uv run pytest
      - name: Every capability and handler has tests and a contract
        run: uv run python scripts/check_capability_coverage.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build

  terraform-plan:
    # Plan on PRs so reviewers see the infra diff before merge; on main the
    # Terraform Apply workflow runs instead. Shares a concurrency group with
    # it so a plan and an apply never contend for the state lock.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: backend
    concurrency:
      group: terraform-state-demo
      cancel-in-progress: false
    permissions:
      id-token: write # required to fetch the OIDC token for AssumeRoleWithWebIdentity
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Build Lambda deployment package
        run: bash infra/scripts/build_lambda_package.sh
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - name: terraform init
        working-directory: infra/envs/demo
        run: terraform init
      - name: terraform plan
        working-directory: infra/envs/demo
        run: terraform plan -lock-timeout=5m
