name: Terraform Apply (bootstrap remote state)

on:
  workflow_dispatch:

jobs:
  apply-bootstrap:
    runs-on: ubuntu-latest
    environment: aws-apply
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra/bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - name: Import pre-existing state resources (safe no-op if not yet created or already tracked)
        run: |
          terraform import aws_s3_bucket.terraform_state fleetalert-ai-terraform-state || true
          terraform import aws_dynamodb_table.terraform_lock fleetalert-ai-terraform-lock || true
      - run: terraform apply -auto-approve
