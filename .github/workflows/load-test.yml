name: Load test

# Pushes real investigations through the live pipeline at set rates, with a
# scripted model so there's no Claude spend (docs/decisions/ADR-0023).
# For each level it starts the load, waits for the work to finish, probes
# the public API throughout, records a report and cleans up. Results are
# committed to the branch the workflow runs on (never main).
# Cost: roughly $0.20 per 1,000 investigations.

on:
  workflow_dispatch:
    inputs:
      levels:
        description: "Comma-separated rate_per_hour:minutes[:model_latency_ms] levels (minutes <= 12)"
        required: true
        default: "1000:5,10000:10,36000:5"
      path:
        description: "queue = through the SQS backpressure queue (ADR-0024); direct = straight into Step Functions, which can starve the public API"
        type: choice
        options:
          - queue
          - direct
        default: queue
      keep_data:
        description: Keep the load-test alerts and traces afterwards (for inspection)
        type: boolean
        default: false

concurrency:
  group: load-test
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: aws-apply
    permissions:
      id-token: write
      contents: write
    env:
      FUNCTION: fleetalert-ai-demo-load-test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Run levels
        env:
          LEVELS_INPUT: ${{ inputs.levels }}
          LOAD_PATH: ${{ inputs.path }}
          KEEP_DATA: ${{ inputs.keep_data }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -uo pipefail

          # One attempt at a short synchronous call. Returns non-zero instead
          # of exiting: under overload the load-test Lambda itself can be
          # throttled (that killed an earlier run), and that is a measurement
          # to live through, not a reason to stop.
          try_invoke() {
            aws lambda invoke --function-name "$FUNCTION" \
              --cli-binary-format raw-in-base64-out --cli-read-timeout 300 \
              --payload "$1" "$2" > meta.json 2> err.txt || return 1
            if jq -e '.FunctionError' meta.json > /dev/null; then
              echo "Lambda error: $(cat "$2")"
              return 1
            fi
          }
          # For calls that must succeed (cleanup): retry through throttling.
          invoke() {
            for attempt in 1 2 3 4 5 6 7 8; do
              try_invoke "$1" "$2" && return 0
              echo "invoke attempt $attempt failed: $(head -c 300 err.txt)"
              sleep 20
            done
            echo "::error::Lambda call failed after retries"
            return 1
          }
          # Five quick requests to the public API: is the demo still up?
          probe_api() {
            for _ in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$API_BASE_URL/demo/usage" || echo 000)
              if [ "$code" = "200" ]; then api_ok=$((api_ok + 1)); else api_err=$((api_err + 1)); fi
            done
          }

          mkdir -p docs/load-tests
          invoke '{"action":"cleanup_all"}' leftovers.json || exit 1
          echo "Removed leftovers from earlier runs: $(cat leftovers.json)"
          stamp=$(date -u +%Y-%m-%dT%H%M)
          echo "## Load test ($stamp, path: $LOAD_PATH)" >> "$GITHUB_STEP_SUMMARY"
          IFS=',' read -ra LEVELS <<< "$LEVELS_INPUT"
          for level in "${LEVELS[@]}"; do
            IFS=':' read -r rate minutes latency <<< "$level"
            latency="${latency:-0}"
            if ! [[ "$rate" =~ ^[0-9]+$ && "$minutes" =~ ^[0-9]+(\.[0-9]+)?$ && "$latency" =~ ^[0-9]+$ ]]; then
              echo "::error::Bad level '$level'; expected rate_per_hour:minutes[:model_latency_ms], e.g. 10000:10 or 3600:5:2000"
              exit 1
            fi
            label="${GITHUB_RUN_ID}-${LOAD_PATH}-${rate}-${latency}"
            echo "::group::$rate/hour for $minutes minutes, model latency ${latency} ms, path $LOAD_PATH ($label)"
            api_ok=0
            api_err=0
            rm -f report.json
            # Asynchronous: a long synchronous invocation lost its connection
            # and was retried by the CLI, re-running the whole load (ADR-0023).
            aws lambda invoke --function-name "$FUNCTION" --invocation-type Event \
              --cli-binary-format raw-in-base64-out \
              --payload "$(jq -nc --arg l "$label" --arg p "$LOAD_PATH" --argjson r "$rate" --argjson m "$minutes" --argjson lat "$latency" \
                '{action:"run", label:$l, path:$p, rate_per_hour:$r, minutes:$m, model_latency_ms:$lat}')" /dev/null \
              || { echo "::error::could not start the generator"; exit 1; }
            # Wait for generation to finish and the work to drain: the run's
            # own length plus up to 30 minutes of backlog.
            polls=$(( (${minutes%.*} + 30) * 3 ))
            for i in $(seq 1 "$polls"); do
              sleep 20
              probe_api
              if ! try_invoke "$(jq -nc --arg l "$label" '{action:"report", label:$l}')" report.tmp.json; then
                echo "poll $i: report unavailable ($(head -c 120 err.txt)) · API ok $api_ok, errors $api_err"
                continue
              fi
              mv report.tmp.json report.json
              generation=$(jq -r '.generation' report.json)
              pending=$(jq '.pending' report.json)
              echo "poll $i: generation $generation, $(jq '.completed' report.json) of $(jq '.alerts' report.json) completed, $pending pending · API ok $api_ok, errors $api_err"
              [ "$generation" = "done" ] && [ "$pending" = "0" ] && break
            done
            out="docs/load-tests/${stamp}-${LOAD_PATH}-${rate}-${latency}ms.json"
            if [ -f report.json ]; then
              jq --arg p "$LOAD_PATH" --argjson ok "$api_ok" --argjson err "$api_err" \
                '. + {path: $p, api_probe: {ok: $ok, errors: $err}}' report.json > "$out"
              jq -r '.markdown' report.json >> "$GITHUB_STEP_SUMMARY"
              jq -r '"Generator: started \(.run.started) of \(.run.requested) (start errors: \(.run.start_errors | tostring)), achieved \(.run.achieved_rate_per_hour)/hour"' report.json >> "$GITHUB_STEP_SUMMARY"
            else
              jq -nc --arg l "$label" --arg p "$LOAD_PATH" --argjson ok "$api_ok" --argjson err "$api_err" \
                '{label: $l, path: $p, error: "no report could be read", api_probe: {ok: $ok, errors: $err}}' > "$out"
            fi
            echo "Public API during this level: $api_ok ok, $api_err errors" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ "$KEEP_DATA" != "true" ]; then
              invoke "$(jq -nc --arg l "$label" '{action:"cleanup", label:$l}')" cleanup.json && cat cleanup.json
            fi
            echo "::endgroup::"
          done
      - name: Commit results
        if: always() && github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/load-tests
          if git diff --cached --quiet; then
            echo "Nothing recorded."
          else
            git commit -m "Record load test results (run ${GITHUB_RUN_ID})"
            git push
          fi
