name: Seed Demo Data

# Loads Machines/KnowledgeBase/Alerts into the real DynamoDB tables (see
# backend/scripts/seed_demo_data.py -- safe to re-run, every write is a
# put_item). Gated the same as the apply workflows since it writes real
# data, even though it's not a Terraform apply.

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: aws-apply
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - run: uv run python scripts/seed_demo_data.py
