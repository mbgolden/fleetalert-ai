name: Frontend Deploy

# Builds the React app and syncs it to the S3 bucket CloudFront serves,
# then invalidates the CloudFront cache. Runs automatically when a merge to
# main touches frontend/ -- validation happens on the PR (CI must pass
# before merge), so main deploys directly. Manual dispatch kept for re-runs.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-apply
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ vars.FRONTEND_BUCKET_NAME }}" --delete
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.FRONTEND_DISTRIBUTION_ID }}" --paths "/*"
